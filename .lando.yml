name: brooklands-hub
recipe: lemp

config:
  webroot: public
  php: "8.4"
  composer_version: "2"
  database: mysql:8.0
  creds:
    user: laravel
    password: laravel
    database: laravel

services:
  redis:
    type: redis:7
    portforward: true

  # Dedicated queue worker. Mirrors the appserver's PHP so that vendor/, which
  # Composer resolves against the appserver's version, passes platform_check.
  # The entrypoint waits for redis and mysql before starting, because
  # depends_on only waits for the container, not the service inside it.
  horizon:
    type: php:8.4
    via: cli
    app_mount: cached
    # Starts as root to trust Lando's CA (so Horizon can reach *.lndo.site over
    # HTTPS), then drops to www-data and runs the worker. Both steps live in the
    # one script because Lando passes this straight to docker-php-entrypoint,
    # which does not interpret shell operators like `&&`.
    command: sh /app/docker/horizon-ca.sh
    depends_on:
      - database
      - redis
    overrides:
      environment:
        # A `via: cli` service gets no .env handling of its own, so the
        # connection details Horizon needs are set explicitly here.
        APP_ENV: local
        APP_DEBUG: "true"
        QUEUE_CONNECTION: redis
        REDIS_CLIENT: predis
        REDIS_HOST: redis
        REDIS_PORT: "6379"
        DB_CONNECTION: mysql
        DB_HOST: database
        DB_PORT: "3306"
        DB_DATABASE: laravel
        DB_USERNAME: laravel
        DB_PASSWORD: laravel

tooling:
  artisan:
    service: appserver
    cmd: php /app/artisan

  # Restart the worker after changing queued code, so it picks up new classes.
  # Runs in the horizon service itself: terminate signals the master process,
  # which lives in that container, and the entrypoint loop starts a fresh one.
  horizon-restart:
    service: horizon
    cmd: php /app/artisan horizon:terminate
    description: Restart the Horizon worker so it picks up code changes

  horizon-status:
    service: horizon
    cmd: php /app/artisan horizon:status
    description: Report whether the Horizon worker is running

proxy:
  appserver_nginx:
    - brooklands-hub.lndo.site
